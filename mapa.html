
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mapa de huecos | HUECOS VILLAVICENCIO</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f6fa;
    color:#183153;
}

header{
    background:#12345a;
    color:white;
    padding:24px 15px;
    text-align:center;
}

header h1{
    margin:0 0 8px;
    font-size:25px;
}

header p{
    margin:0;
    line-height:1.5;
}

main{
    max-width:1150px;
    margin:25px auto;
    padding:15px;
}

.panel{
    background:white;
    padding:22px;
    border-radius:12px;
    box-shadow:0 4px 15px #00000012;
}

.barra{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:12px;
}

h2{margin:0}

button,.boton{
    background:#115b99;
    color:white;
    padding:12px 17px;
    border:0;
    border-radius:8px;
    font-size:14px;
    font-weight:bold;
    text-decoration:none;
    cursor:pointer;
}

button:disabled{
    opacity:.6;
    cursor:wait;
}

.resumen{
    background:#edf4fa;
    border-radius:9px;
    padding:15px;
    margin:18px 0;
}

.resumen strong{
    font-size:22px;
    color:#115b99;
}

/* Leyenda de estados */

.leyenda{
    display:flex;
    flex-wrap:wrap;
    gap:12px 22px;
    margin:0 0 18px;
    align-items:center;
}

.leyenda-item{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:13px;
}

.punto-leyenda{
    width:15px;
    height:15px;
    border-radius:50%;
    flex-shrink:0;
    border:2px solid white;
    box-shadow:0 0 0 1px #cbd5e1;
}

.rojo{background:#d93636}
.amarillo{background:#e9a600}
.verde{background:#198754}

#mapa{
    width:100%;
    height:560px;
    border:1px solid #d1dce6;
    border-radius:10px;
    overflow:hidden;
}

#estado{
    margin-top:15px;
    line-height:1.6;
    color:#52667b;
}

.error{color:#a12323!important}
.correcto{color:#12623c!important}

.volver{
    display:inline-block;
    margin-top:20px;
    color:#115b99;
    text-decoration:none;
}

.volver:hover{text-decoration:underline}

.detalle-popup{
    line-height:1.7;
    min-width:190px;
}

.etiqueta-estado{
    display:inline-block;
    margin-top:8px;
    padding:4px 9px;
    border-radius:6px;
    font-size:12px;
    font-weight:bold;
}

.estado-reportado{
    background:#fde8e8;
    color:#a82020;
}

.estado-pendiente{
    background:#fff3cd;
    color:#805900;
}

.estado-reparado{
    background:#dff3e7;
    color:#146c43;
}

.estado-desconocido{
    background:#e8edf3;
    color:#52667b;
}

.verificado{
    margin-top:8px;
    font-size:12px;
    font-weight:bold;
    color:#12623c;
}

/* Marcadores de colores */

.marcador-estado{
    width:24px;
    height:24px;
    border:3px solid white;
    border-radius:50%;
    box-shadow:0 2px 7px #00000055;
}

@media(max-width:600px){
    main{margin:10px auto;padding:10px}
    .panel{padding:15px}
    header h1{font-size:21px}
    #mapa{height:480px}
    .barra{align-items:flex-start}
    .leyenda{gap:10px}
    .leyenda-item{width:100%}
}
</style>
</head>

<body>

<header>
    <h1>HUECOS VILLAVICENCIO</h1>
    <p>Mapa ciudadano de huecos reportados y aprobados</p>
</header>

<main>
<section class="panel">

    <div class="barra">
        <h2>Mapa de huecos</h2>
        <button id="actualizar" type="button">
            Actualizar mapa
        </button>
    </div>

    <div class="resumen">
        <strong id="totalHuecos">0</strong>
        <div>Huecos publicados</div>
    </div>

    <!-- Leyenda de estados -->

    <div class="leyenda">

        <div class="leyenda-item">
            <span class="punto-leyenda rojo"></span>
            <span>Hueco reportado</span>
        </div>

        <div class="leyenda-item">
            <span class="punto-leyenda amarillo"></span>
            <span>Reparación pendiente de verificación</span>
        </div>

        <div class="leyenda-item">
            <span class="punto-leyenda verde"></span>
            <span>Hueco reparado</span>
        </div>

    </div>

    <div id="mapa"
         aria-label="Mapa público de huecos en Villavicencio">
    </div>

    <p id="estado" role="status" aria-live="polite">
        Cargando mapa...
    </p>

    <a href="index.html" class="volver">
        ← Volver al inicio
    </a>

</section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>

<script type="module">

import {createClient} from
'https://esm.sh/@supabase/supabase-js@2';

const supabase=createClient(
    'https://svwsaunrxskdifvsillz.supabase.co',
    'sb_publishable_HYvQ6grfV_I-yxVhuG1qwQ_xRJIJCCI'
);

const estado=document.getElementById('estado');
const totalHuecos=document.getElementById('totalHuecos');
const actualizar=document.getElementById('actualizar');

let mapa;
let marcadores;
let cargando=false;

/* Configuración de estados */

const estados={

    REPORTADO:{
        texto:'Hueco reportado',
        color:'#d93636',
        clase:'estado-reportado'
    },

    REPARACION_REPORTADA:{
        texto:'Reparación pendiente de verificación',
        color:'#e9a600',
        clase:'estado-pendiente'
    },

    REPARADO:{
        texto:'Hueco reparado',
        color:'#198754',
        clase:'estado-reparado'
    }

};

function obtenerEstado(valor){

    return estados[valor]||{
        texto:'Estado no disponible',
        color:'#52667b',
        clase:'estado-desconocido'
    };

}

function mostrarEstado(texto,tipo=''){
    estado.textContent=texto;
    estado.className=tipo;
}

function inicializarMapa(){

    if(typeof L==='undefined'){
        mostrarEstado(
            'No fue posible cargar el mapa. Comprueba tu conexión.',
            'error'
        );
        return false;
    }

    mapa=L.map('mapa').setView(
        [4.1420,-73.6266],
        13
    );

    L.tileLayer(
        'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
        {
            maxZoom:19,
            attribution:'&copy; OpenStreetMap contributors'
        }
    ).addTo(mapa);

    marcadores=L.featureGroup().addTo(mapa);

    requestAnimationFrame(()=>{
        mapa.invalidateSize();
    });

    window.addEventListener('resize',()=>{
        mapa.invalidateSize();
    });

    return true;
}

/* Crear icono según el estado */

function crearIcono(estadoHueco){

    const configuracion=obtenerEstado(estadoHueco);

    return L.divIcon({
        className:'',
        html:
            '<div class="marcador-estado" '+
            'style="background-color:'+
            configuracion.color+
            '"></div>',
        iconSize:[24,24],
        iconAnchor:[12,12],
        popupAnchor:[0,-14]
    });

}

/* Crear información del hueco */

function crearPopup(hueco){

    const contenedor=document.createElement('div');
    contenedor.className='detalle-popup';

    const titulo=document.createElement('strong');
    titulo.textContent='Hueco #'+hueco.id_hueco;
    contenedor.appendChild(titulo);

    const direccion=document.createElement('div');
    direccion.textContent=
        'Dirección: '+(hueco.direccion||'No registrada');
    contenedor.appendChild(direccion);

    const gravedad=document.createElement('div');
    gravedad.textContent=
        'Gravedad: '+(hueco.gravedad||'No registrada');
    contenedor.appendChild(gravedad);

    const configuracion=obtenerEstado(hueco.estado);

    const etiqueta=document.createElement('div');
    etiqueta.className=
        'etiqueta-estado '+configuracion.clase;
    etiqueta.textContent=configuracion.texto;
    contenedor.appendChild(etiqueta);

    const verificado=document.createElement('div');
    verificado.className='verificado';
    verificado.textContent='✓ Reporte verificado';
    contenedor.appendChild(verificado);

    return contenedor;
}

async function cargarHuecos(){

    if(!mapa||cargando)return;

    cargando=true;
    actualizar.disabled=true;

    mostrarEstado('Consultando huecos aprobados...');

    try{

        /*
          La política RLS de public.huecos
          determina cuáles huecos son visibles
          para los visitantes.
        */

        const {data,error}=await supabase
            .from('huecos')
            .select(
                'id_hueco,latitud,longitud,direccion,gravedad,estado'
            )
            .order('id_hueco',{ascending:false})
            .limit(1000);

        if(error)throw error;

        const huecos=data||[];

        marcadores.clearLayers();

        let publicados=0;

        for(const hueco of huecos){

            const lat=Number(hueco.latitud);
            const lng=Number(hueco.longitud);

            if(
                hueco.latitud===null||
                hueco.longitud===null||
                !Number.isFinite(lat)||
                !Number.isFinite(lng)||
                lat < -90 || lat > 90 ||
                lng < -180 || lng > 180
            ){
                continue;
            }

            const marcador=L.marker(
                [lat,lng],
                {
                    icon:crearIcono(hueco.estado)
                }
            );

            marcador.bindPopup(
                crearPopup(hueco)
            );

            marcadores.addLayer(marcador);

            publicados++;
        }

        totalHuecos.textContent=publicados;

        if(publicados===0){

            mostrarEstado(
                'Actualmente no hay huecos aprobados para mostrar.',
                'correcto'
            );

        }else{

            mostrarEstado(
                'Se encontraron '+publicados+
                ' hueco(s) publicados.',
                'correcto'
            );

            mapa.fitBounds(
                marcadores.getBounds(),
                {
                    padding:[35,35],
                    maxZoom:16
                }
            );
        }

    }catch(error){

        mostrarEstado(
            'No fue posible consultar los huecos: '+
            error.message,
            'error'
        );

    }finally{

        cargando=false;
        actualizar.disabled=false;

    }
}

actualizar.addEventListener('click',cargarHuecos);

if(inicializarMapa()){
    cargarHuecos();
}

</script>
</body>
</html>
