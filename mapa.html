
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mapa de huecos | HUECOS VILLAVICENCIO</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f6fa;
    color:#183153;
}

header{
    background:#12345a;
    color:white;
    padding:24px 15px;
    text-align:center;
}

header h1{
    margin:0 0 8px;
    font-size:25px;
}

header p{
    margin:0;
    line-height:1.5;
}

main{
    max-width:1150px;
    margin:25px auto;
    padding:15px;
}

.panel{
    background:white;
    padding:22px;
    border-radius:12px;
    box-shadow:0 4px 15px #00000012;
}

.barra{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:12px;
}

h2{margin:0}

button,.boton{
    background:#115b99;
    color:white;
    padding:12px 17px;
    border:0;
    border-radius:8px;
    font-size:14px;
    font-weight:bold;
    text-decoration:none;
    cursor:pointer;
}

button:disabled{
    opacity:.6;
    cursor:wait;
}

.resumen{
    background:#edf4fa;
    border-radius:9px;
    padding:15px;
    margin:18px 0;
}

.resumen strong{
    font-size:22px;
    color:#115b99;
}

/* Leyenda de estados */

.leyenda{
    display:flex;
    flex-wrap:wrap;
    gap:12px 22px;
    margin:0 0 18px;
    align-items:center;
}

.leyenda-item{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:13px;
}

.punto-leyenda{
    width:15px;
    height:15px;
    border-radius:50%;
    flex-shrink:0;
    border:2px solid white;
    box-shadow:0 0 0 1px #cbd5e1;
}

.rojo{background:#d93636}
.amarillo{background:#e9a600}
.verde{background:#198754}

#mapa{
    width:100%;
    height:560px;
    border:1px solid #d1dce6;
    border-radius:10px;
    overflow:hidden;
}

#estado{
    margin-top:15px;
    line-height:1.6;
    color:#52667b;
}

.error{color:#a12323!important}
.correcto{color:#12623c!important}

.volver{
    display:inline-block;
    margin-top:20px;
    color:#115b99;
    text-decoration:none;
}

.volver:hover{text-decoration:underline}

.detalle-popup{
    line-height:1.7;
    min-width:190px;
}

.etiqueta-estado{
    display:inline-block;
    margin-top:8px;
    padding:4px 9px;
    border-radius:6px;
    font-size:12px;
    font-weight:bold;
}

.estado-reportado{
    background:#fde8e8;
    color:#a82020;
}

.estado-pendiente{
    background:#fff3cd;
    color:#805900;
}

.estado-reparado{
    background:#dff3e7;
    color:#146c43;
}

.estado-desconocido{
    background:#e8edf3;
    color:#52667b;
}

.verificado{
    margin-top:8px;
    font-size:12px;
    font-weight:bold;
    color:#12623c;
}

/* Etiquetas de gravedad */

.etiqueta-gravedad{
    display:inline-block;
    padding:4px 9px;
    border-radius:6px;
    font-size:12px;
    font-weight:bold;
    margin-top:5px;
}

.gravedad-alta{background:#fde8e8;color:#a82020}
.gravedad-media{background:#ffedd5;color:#9a3412}
.gravedad-baja{background:#fff3cd;color:#805900}
.gravedad-desconocida{background:#e8edf3;color:#52667b}

/* Marcadores de colores */

.marcador-estado{
    width:24px;
    height:24px;
    border:3px solid white;
    border-radius:50%;
    box-shadow:0 2px 7px #00000055;
}

@media(max-width:600px){
    main{margin:10px auto;padding:10px}
    .panel{padding:15px}
    header h1{font-size:21px}
    #mapa{height:480px}
    .barra{align-items:flex-start}
    .leyenda{gap:10px}
    .leyenda-item{width:100%}
}

/* Leyenda interactiva */
.leyenda-item{
    background:#fff;
    border:1px solid #d6e1ec;
    border-radius:9px;
    padding:11px 13px;
    cursor:pointer;
    color:#183153;
    text-align:left;
    justify-content:space-between;
    width:100%;
    transition:background .15s,border-color .15s;
}
.leyenda-item:hover{background:#f0f6fc}
.leyenda-item.activo{
    background:#edf4fa;
    border-color:#115b99;
    box-shadow:inset 0 0 0 1px #115b99;
}
.leyenda-item:focus-visible{outline:3px solid #76a9dd;outline-offset:2px}
.leyenda-nombre{display:flex;align-items:center;gap:10px}
.leyenda-cantidad{
    font-size:15px;
    font-weight:bold;
    min-width:28px;
    text-align:right;
}
#mostrarTodos{
    background:#52667b;
    margin-bottom:18px;
}
@media(min-width:750px){
    .leyenda{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
}

</style>
</head>

<body>

<header>
    <h1>HUECOS VILLAVICENCIO</h1>
    <p>Mapa ciudadano de huecos reportados y aprobados</p>
</header>

<main>
<section class="panel">

    <div class="barra">
        <h2>Mapa de huecos</h2>
        <button id="actualizar" type="button">
            Actualizar mapa
        </button>
    </div>

    <div class="resumen">
        <strong id="totalHuecos">0</strong>
        <div>Huecos publicados</div>
    </div>

    <!-- Leyenda de estados -->

    <div class="leyenda" aria-label="Filtrar huecos por estado">
        <button class="leyenda-item" type="button" data-estado="REPORTADO" aria-pressed="false">
            <span class="leyenda-nombre"><span class="punto-leyenda rojo"></span>HUECO REPORTADO</span>
            <span class="leyenda-cantidad" id="cantidadReportados">0</span>
        </button>
        <button class="leyenda-item" type="button" data-estado="REPARACION_REPORTADA" aria-pressed="false">
            <span class="leyenda-nombre"><span class="punto-leyenda amarillo"></span>HUECO EN REPARACIÓN</span>
            <span class="leyenda-cantidad" id="cantidadReparacion">0</span>
        </button>
        <button class="leyenda-item" type="button" data-estado="REPARADO" aria-pressed="false">
            <span class="leyenda-nombre"><span class="punto-leyenda verde"></span>HUECO REPARADO</span>
            <span class="leyenda-cantidad" id="cantidadReparados">0</span>
        </button>
    </div>
    <button id="mostrarTodos" type="button" hidden>Mostrar todos los huecos</button>

    <div id="mapa"
         aria-label="Mapa público de huecos en Villavicencio">
    </div>

    <p id="estado" role="status" aria-live="polite">
        Cargando mapa...
    </p>

    <a href="index.html" class="volver">
        ← Volver al inicio
    </a>

</section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>

<script type="module">

import {createClient} from
'https://esm.sh/@supabase/supabase-js@2';

const supabase=createClient(
    'https://svwsaunrxskdifvsillz.supabase.co',
    'sb_publishable_HYvQ6grfV_I-yxVhuG1qwQ_xRJIJCCI'
);

const estado=document.getElementById('estado');
const totalHuecos=document.getElementById('totalHuecos');
const actualizar=document.getElementById('actualizar');

let mapa;
let marcadores;
let cargando=false;
let filtroActivo=null;
let huecosMapa=[];

const botonesFiltro=[...document.querySelectorAll('.leyenda-item[data-estado]')];
const mostrarTodos=document.getElementById('mostrarTodos');
const contadoresEstado={
    REPORTADO:document.getElementById('cantidadReportados'),
    REPARACION_REPORTADA:document.getElementById('cantidadReparacion'),
    REPARADO:document.getElementById('cantidadReparados')
};

/* Configuración de estados */

const estados={

    REPORTADO:{
        texto:'HUECO REPORTADO',
        color:'#d93636',
        clase:'estado-reportado'
    },

    REPARACION_REPORTADA:{
        texto:'HUECO EN REPARACIÓN',
        color:'#e9a600',
        clase:'estado-pendiente'
    },

    REPARADO:{
        texto:'HUECO REPARADO',
        color:'#198754',
        clase:'estado-reparado'
    }

};

function obtenerEstado(valor){

    return estados[valor]||{
        texto:'Estado no disponible',
        color:'#52667b',
        clase:'estado-desconocido'
    };

}

function mostrarEstado(texto,tipo=''){
    estado.textContent=texto;
    estado.className=tipo;
}

function inicializarMapa(){

    if(typeof L==='undefined'){
        mostrarEstado(
            'No fue posible cargar el mapa. Comprueba tu conexión.',
            'error'
        );
        return false;
    }

    mapa=L.map('mapa').setView(
        [4.1420,-73.6266],
        13
    );

    L.tileLayer(
        'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
        {
            maxZoom:19,
            attribution:'&copy; OpenStreetMap contributors'
        }
    ).addTo(mapa);

    marcadores=L.featureGroup().addTo(mapa);

    requestAnimationFrame(()=>{
        mapa.invalidateSize();
    });

    window.addEventListener('resize',()=>{
        mapa.invalidateSize();
    });

    return true;
}

/* Crear icono según el estado */

function crearIcono(estadoHueco){

    const configuracion=obtenerEstado(estadoHueco);

    return L.divIcon({
        className:'',
        html:
            '<div class="marcador-estado" '+
            'style="background-color:'+
            configuracion.color+
            '"></div>',
        iconSize:[24,24],
        iconAnchor:[12,12],
        popupAnchor:[0,-14]
    });

}

/* Crear información del hueco */

function crearPopup(hueco){

    const contenedor=document.createElement('div');
    contenedor.className='detalle-popup';

    const titulo=document.createElement('strong');
    titulo.textContent='Hueco #'+hueco.id_hueco;
    contenedor.appendChild(titulo);

    const direccion=document.createElement('div');
    direccion.textContent=
        'Dirección: '+(hueco.direccion||'No registrada');
    contenedor.appendChild(direccion);

    const gravedad=document.createElement('div');
    const textoGravedad=document.createElement('span');
    textoGravedad.textContent='Gravedad: ';

    const etiquetaGravedad=document.createElement('span');
    const nivel=String(hueco.gravedad||'').trim().toUpperCase();
    const clasesGravedad={
        ALTA:'gravedad-alta',
        MEDIA:'gravedad-media',
        BAJA:'gravedad-baja'
    };

    etiquetaGravedad.className='etiqueta-gravedad '+
        (clasesGravedad[nivel]||'gravedad-desconocida');
    etiquetaGravedad.textContent=clasesGravedad[nivel]
        ? nivel : 'No registrada';

    gravedad.appendChild(textoGravedad);
    gravedad.appendChild(etiquetaGravedad);
    contenedor.appendChild(gravedad);

    const configuracion=obtenerEstado(hueco.estado);

    const etiqueta=document.createElement('div');
    etiqueta.className=
        'etiqueta-estado '+configuracion.clase;
    etiqueta.textContent=configuracion.texto;
    contenedor.appendChild(etiqueta);

    const verificado=document.createElement('div');
    verificado.className='verificado';
    verificado.textContent='✓ Reporte verificado';
    contenedor.appendChild(verificado);

    return contenedor;
}

function actualizarLeyenda(){
    const cantidades={REPORTADO:0,REPARACION_REPORTADA:0,REPARADO:0};
    for(const hueco of huecosMapa){
        if(Object.prototype.hasOwnProperty.call(cantidades,hueco.estado)){
            cantidades[hueco.estado]++;
        }
    }
    for(const [clave,elemento] of Object.entries(contadoresEstado)){
        elemento.textContent=cantidades[clave];
    }
    totalHuecos.textContent=huecosMapa.length;
    botonesFiltro.forEach(boton=>{
        const seleccionado=boton.dataset.estado===filtroActivo;
        boton.classList.toggle('activo',seleccionado);
        boton.setAttribute('aria-pressed',String(seleccionado));
    });
    mostrarTodos.hidden=!filtroActivo;
}

function dibujarHuecos(){
    if(!mapa||!marcadores)return;
    marcadores.clearLayers();
    const visibles=huecosMapa.filter(hueco=>!filtroActivo||hueco.estado===filtroActivo);

    for(const hueco of visibles){
        const marcador=L.marker([hueco.lat,hueco.lng],{
            icon:crearIcono(hueco.estado)
        });
        marcador.bindPopup(crearPopup(hueco));
        marcadores.addLayer(marcador);
    }

    actualizarLeyenda();
    if(visibles.length){
        mapa.fitBounds(marcadores.getBounds(),{padding:[35,35],maxZoom:16});
    }

    if(filtroActivo){
        mostrarEstado(
            'Mostrando '+visibles.length+' hueco(s) de '+estados[filtroActivo].texto+
            '. Total publicados: '+huecosMapa.length+'.',
            'correcto'
        );
    }else{
        mostrarEstado(
            huecosMapa.length
                ? 'Se encontraron '+huecosMapa.length+' hueco(s) publicados.'
                : 'Actualmente no hay huecos aprobados para mostrar.',
            'correcto'
        );
    }
}

botonesFiltro.forEach(boton=>{
    boton.addEventListener('click',()=>{
        filtroActivo=filtroActivo===boton.dataset.estado?null:boton.dataset.estado;
        dibujarHuecos();
    });
});
mostrarTodos.addEventListener('click',()=>{
    filtroActivo=null;
    dibujarHuecos();
});

async function cargarHuecos(){
    if(!mapa||cargando)return;
    cargando=true;
    actualizar.disabled=true;
    mostrarEstado('Consultando huecos aprobados...');

    try{
        // Se mantienen las mismas reglas de visibilidad RLS y columnas originales.
        const {data,error}=await supabase
            .from('huecos')
            .select('id_hueco,latitud,longitud,direccion,gravedad,estado')
            .order('id_hueco',{ascending:false})
            .limit(1000);

        if(error)throw error;

        const validos=[];
        for(const hueco of data||[]){
            const lat=Number(hueco.latitud);
            const lng=Number(hueco.longitud);
            if(
                hueco.latitud===null||hueco.longitud===null||
                !Number.isFinite(lat)||!Number.isFinite(lng)||
                lat < -90||lat > 90||lng < -180||lng > 180
            )continue;
            validos.push({...hueco,lat,lng});
        }

        huecosMapa=validos;
        dibujarHuecos();
    }catch(error){
        mostrarEstado('No fue posible consultar los huecos: '+error.message,'error');
    }finally{
        cargando=false;
        actualizar.disabled=false;
    }
}

actualizar.addEventListener('click',cargarHuecos);

if(inicializarMapa()){
    cargarHuecos();
}

</script>
</body>
</html>
