<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registro de ciudadanos | Huecos Villavicencio</title>

<style>
:root {
    font-family: system-ui, -apple-system, Segoe UI, sans-serif;
    color: #183047;
    background: #f3f7fb;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 28px 14px;
}

.panel {
    max-width: 540px;
    margin: 30px auto;
    background: #fff;
    border-radius: 16px;
    padding: 30px;
    box-shadow: 0 8px 30px #17385814;
}

h1 {
    font-size: 1.5rem;
    margin: 0 0 6px;
    color: #123b65;
}

.sub {
    color: #52667b;
    margin: 0 0 25px;
}

label {
    display: block;
    font-weight: 600;
    font-size: .9rem;
    margin: 15px 0 6px;
}

input {
    width: 100%;
    border: 1px solid #c5d0dc;
    border-radius: 8px;
    padding: 12px;
    font: inherit;
}

input:focus {
    outline: 2px solid #4e93ce;
    outline-offset: 1px;
}

button {
    background: #115b99;
    color: #fff;
    border: 0;
    border-radius: 9px;
    padding: 13px 16px;
    font: inherit;
    font-weight: 650;
    cursor: pointer;
    width: 100%;
    margin-top: 22px;
}

button:disabled {
    opacity: .65;
    cursor: wait;
}

.notice {
    padding: 12px;
    border-radius: 8px;
    margin-top: 17px;
    display: none;
    white-space: pre-wrap;
}

.notice.ok {
    display: block;
    background: #e8f6ee;
    color: #125d32;
}

.notice.error {
    display: block;
    background: #fff0ee;
    color: #9b2929;
}

.foot {
    font-size: .82rem;
    color: #627387;
    margin-top: 20px;
    line-height: 1.5;
}

.volver {
    display: block;
    text-align: center;
    margin-top: 22px;
    color: #115b99;
    text-decoration: none;
    font-weight: 600;
}

.volver:hover {
    text-decoration: underline;
}
</style>
</head>

<body>

<main class="panel">

    <h1>HUECOS VILLAVICENCIO</h1>

    <p class="sub">
        Plataforma ciudadana de reporte vial<br>
        Registro de ciudadanos
    </p>

    <form id="formulario">

        <label for="nombres">Nombres</label>
        <input
            id="nombres"
            name="nombres"
            autocomplete="given-name"
            required
            maxlength="100"
        >

        <label for="apellidos">Apellidos</label>
        <input
            id="apellidos"
            name="apellidos"
            autocomplete="family-name"
            required
            maxlength="100"
        >

        <label for="correo">Correo electrónico</label>
        <input
            id="correo"
            name="correo"
            type="email"
            autocomplete="email"
            required
            maxlength="150"
        >

        <label for="clave">Contraseña</label>
        <input
            id="clave"
            name="clave"
            type="password"
            autocomplete="new-password"
            required
            minlength="8"
            pattern="(?=.*[A-Za-z])(?=.*[0-9]).{10,}"
            title="Mínimo 10 caracteres, con letras y números"
        >

        <button id="registrar" type="submit">
            Registrar ciudadano
        </button>

    </form>

    <div
        id="mensaje"
        class="notice"
        role="status"
        aria-live="polite">
    </div>

    <p class="foot">
        Al registrarte, recibirás un correo de confirmación
        si esta opción está habilitada en Supabase.
        Deberás confirmar tu cuenta antes de iniciar sesión.
    </p>

    <a
        class="volver"
        href="index.html">
        ← Volver a la página principal
    </a>

</main>

<script type="module">

import { createClient } from
'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_URL =
'https://svwsaunrxskdifvsillz.supabase.co';

const SUPABASE_PUBLISHABLE_KEY =
'sb_publishable_HYvQ6grfV_I-yxVhuG1qwQ_xRJIJCCI';

const SITE_URL =
'https://juandiegovargascastro91-source.github.io/huecos-villavicencio/';

const supabase = createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);

const form = document.getElementById('formulario');

const button = document.getElementById('registrar');

const message = document.getElementById('mensaje');

function show(text, success) {

    message.textContent = text;

    message.className =
        'notice ' + (success ? 'ok' : 'error');

}

form.addEventListener('submit', async (event) => {

    event.preventDefault();

    const nombres =
        document.getElementById('nombres').value.trim();

    const apellidos =
        document.getElementById('apellidos').value.trim();

    const email =
        document.getElementById('correo').value.trim();

    const password =
        document.getElementById('clave').value;

    if (!nombres || !apellidos) {

        show(
            'Debes ingresar nombres y apellidos.',
            false
        );

        return;
    }

    button.disabled = true;

    button.textContent = 'Registrando...';

    try {

        const { data, error } =
            await supabase.auth.signUp({

                email,

                password,

                options: {

                    emailRedirectTo: SITE_URL,

                    data: {
                        nombres,
                        apellidos
                    }

                }

            });

        if (error) {
            throw error;
        }

        if (!data.user) {

            show(
                'No se pudo confirmar la respuesta del registro. Verifica en Supabase.',
                false
            );

            return;
        }

        if (data.session) {

            show(
                'Registro realizado correctamente. Tu sesión está activa.',
                true
            );

        } else {

            show(
                'Solicitud de registro recibida. Si Supabase requiere confirmación, revisa tu correo electrónico y confirma tu cuenta.',
                true
            );

        }

        form.reset();

    } catch (err) {

        show(
            'Error durante el registro: ' +
            (err?.message || String(err)),
            false
        );

    } finally {

        button.disabled = false;

        button.textContent = 'Registrar ciudadano';

    }

});

</script>

</body>
</html>
