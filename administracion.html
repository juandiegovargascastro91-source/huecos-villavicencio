
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Administración | HUECOS VILLAVICENCIO</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f3f6fa;
    color: #183153;
    font-family: Arial, sans-serif;
}

header {
    background: #12345a;
    color: white;
    padding: 24px 20px;
    text-align: center;
}

header h1 {
    margin: 0 0 8px;
    font-size: 25px;
}

header p {
    margin: 0;
}

main {
    max-width: 1150px;
    margin: 25px auto;
    padding: 15px;
}

.panel {
    background: white;
    padding: 24px;
    border-radius: 13px;
    box-shadow: 0 4px 18px #00000012;
    margin-bottom: 20px;
}

.barra {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
}

h2 {
    margin-top: 0;
}

button {
    background: #115b99;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 12px 18px;
    cursor: pointer;
    font-size: 14px;
    font-weight: bold;
}

button:hover {
    background: #0d4778;
}

button:disabled {
    opacity: .6;
    cursor: not-allowed;
}

.secundario {
    background: #52667b;
}

.aprobar {
    background: #167346;
}

.rechazar {
    background: #b33434;
}

.acciones {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 15px;
}

.aviso {
    color: #52667b;
    line-height: 1.6;
}

.error {
    color: #a12323;
}

.correcto {
    color: #12623c;
}

.resumen {
    display: grid;
    grid-template-columns: repeat(
        auto-fit,
        minmax(180px, 1fr)
    );
    gap: 15px;
    margin-bottom: 20px;
}

.indicador {
    background: white;
    padding: 22px;
    border-radius: 12px;
    text-align: center;
    box-shadow: 0 4px 15px #00000010;
}

.indicador strong {
    display: block;
    font-size: 32px;
    color: #115b99;
    margin-bottom: 8px;
}

.reporte {
    border: 1px solid #d6e1ec;
    border-radius: 12px;
    padding: 20px;
    margin-top: 18px;
}

.reporte h3 {
    margin-top: 0;
}

.detalle {
    line-height: 1.9;
    overflow-wrap: anywhere;
}

.etiqueta {
    display: inline-block;
    padding: 6px 11px;
    border-radius: 7px;
    background: #fff3cf;
    color: #795500;
    font-size: 13px;
    font-weight: bold;
}

.mapa-reporte {
    width: 100%;
    height: 280px;
    margin-top: 15px;
    border-radius: 10px;
    border: 1px solid #d6e1ec;
    overflow: hidden;
}

.fotografia {
    margin-top: 12px;
    padding: 12px;
    background: #edf4fa;
    border-radius: 8px;
    font-size: 14px;
}

.oculto {
    display: none !important;
}

@media(max-width:600px) {
    main {
        margin: 10px auto;
        padding: 10px;
    }

    .panel {
        padding: 16px;
    }

    header h1 {
        font-size: 21px;
    }

    .mapa-reporte {
        height: 240px;
    }

    .acciones button {
        flex: 1;
    }
}
</style>
</head>

<body>

<header>
    <h1>HUECOS VILLAVICENCIO</h1>
    <p>Panel de administración y revisión de reportes</p>
</header>

<main>

    <section class="panel">

        <div class="barra">

            <div>
                <h2>Administración de reportes</h2>

                <p id="usuario"
                   class="aviso">
                    Verificando acceso...
                </p>
            </div>

            <button
                id="cerrarSesion"
                class="secundario oculto"
                type="button">
                Cerrar sesión
            </button>

        </div>

        <p id="mensajeGeneral"
           class="aviso"
           role="status"
           aria-live="polite">
        </p>

    </section>

    <div id="contenido" class="oculto">

        <section class="resumen">

            <div class="indicador">
                <strong id="totalPendientes">0</strong>
                Reportes pendientes
            </div>

        </section>

        <section class="panel">

            <div class="barra">

                <h2>Reportes pendientes de revisión</h2>

                <button
                    id="actualizar"
                    type="button">
                    Actualizar
                </button>

            </div>

            <p class="aviso">
                Revisa la ubicación y la información
                de cada reporte antes de aprobarlo
                o rechazarlo.
            </p>

            <div id="listaReportes"></div>

        </section>

    </div>

</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>

<script type="module">

import { createClient } from
'https://esm.sh/@supabase/supabase-js@2';

/* CONEXIÓN SUPABASE */

const supabase = createClient(
    'https://svwsaunrxskdifvsillz.supabase.co',
    'sb_publishable_HYvQ6grfV_I-yxVhuG1qwQ_xRJIJCCI'
);

/* ELEMENTOS */

const usuario = document.getElementById('usuario');

const mensajeGeneral =
    document.getElementById('mensajeGeneral');

const contenido =
    document.getElementById('contenido');

const listaReportes =
    document.getElementById('listaReportes');

const totalPendientes =
    document.getElementById('totalPendientes');

const botonCerrar =
    document.getElementById('cerrarSesion');

const botonActualizar =
    document.getElementById('actualizar');

let autorizado = false;
let cargando = false;
let mapas = [];

/* MENSAJES */

function mostrarMensaje(texto, tipo = 'aviso') {

    mensajeGeneral.textContent = texto;
    mensajeGeneral.className = tipo;

}

/* SEGURIDAD */

async function verificarAcceso() {

    try {

        const { data: usuarioActual, error } =
            await supabase.auth.getUser();

        if (error || !usuarioActual.user) {

            window.location.replace(
                'admin-login.html'
            );

            return;
        }

        const { data: permiso, error: errorPermiso } =
            await supabase.rpc(
                'es_revisor_autorizado'
            );

        if (errorPermiso || permiso !== true) {

            autorizado = false;

            mostrarMensaje(
                'No tienes permisos para acceder ' +
                'al panel administrativo.',
                'error'
            );

            return;
        }

        autorizado = true;

        usuario.textContent =
            'Sesión administrativa: ' +
            usuarioActual.user.email;

        botonCerrar.classList.remove('oculto');

        contenido.classList.remove('oculto');

        await cargarReportes();

    } catch (error) {

        mostrarMensaje(
            'No fue posible verificar el acceso.',
            'error'
        );

    }

}

/* ELIMINAR MAPAS ANTERIORES */

function limpiarMapas() {

    mapas.forEach(mapa => mapa.remove());

    mapas = [];

}

/* CONSULTAR REPORTES */

async function cargarReportes() {

    if (!autorizado || cargando) {
        return;
    }

    cargando = true;
    botonActualizar.disabled = true;

    mostrarMensaje(
        'Consultando reportes pendientes...'
    );

    try {

        const { data, error } =
            await supabase.rpc(
                'consultar_reportes_pendientes'
            );

        if (error) {
            throw error;
        }

        limpiarMapas();

        listaReportes.replaceChildren();

        const reportes = data || [];

        totalPendientes.textContent =
            reportes.length;

        if (reportes.length === 0) {

            const vacio =
                document.createElement('p');

            vacio.className = 'correcto';

            vacio.textContent =
                'No hay reportes pendientes de revisión.';

            listaReportes.appendChild(vacio);

            mostrarMensaje(
                'Consulta realizada correctamente.',
                'correcto'
            );

            return;
        }

        reportes.forEach((reporte, indice) => {

            crearTarjetaReporte(
                reporte,
                indice
            );

        });

        mostrarMensaje(
            'Se encontraron ' +
            reportes.length +
            ' reporte(s) pendiente(s).',
            'correcto'
        );

    } catch (error) {

        mostrarMensaje(
            'No fue posible consultar los reportes: ' +
            error.message,
            'error'
        );

    } finally {

        cargando = false;
        botonActualizar.disabled = false;

    }

}

/* CREAR ELEMENTOS SEGUROS */

function crearTexto(contenedor, etiqueta, valor) {

    const linea =
        document.createElement('div');

    const titulo =
        document.createElement('strong');

    titulo.textContent = etiqueta + ': ';

    linea.appendChild(titulo);

    linea.appendChild(
        document.createTextNode(
            valor === null ||
            valor === undefined ||
            valor === ''
                ? 'No registrado'
                : String(valor)
        )
    );

    contenedor.appendChild(linea);

}

/* MOSTRAR CADA REPORTE */

function crearTarjetaReporte(reporte, indice) {

    const tarjeta =
        document.createElement('article');

    tarjeta.className = 'reporte';

    const titulo =
        document.createElement('h3');

    titulo.textContent =
        'Reporte #' + reporte.id_reporte;

    tarjeta.appendChild(titulo);

    const estado =
        document.createElement('span');

    estado.className = 'etiqueta';

    estado.textContent =
        reporte.estado_validacion;

    tarjeta.appendChild(estado);

    const detalle =
        document.createElement('div');

    detalle.className = 'detalle';

    detalle.style.marginTop = '12px';

    crearTexto(
        detalle,
        'Fecha',
        reporte.fecha_reporte
            ? new Date(
                reporte.fecha_reporte
              ).toLocaleString('es-CO')
            : null
    );

    crearTexto(
        detalle,
        'Dirección',
        reporte.direccion
    );

    crearTexto(
        detalle,
        'Gravedad',
        reporte.gravedad
    );

    crearTexto(
        detalle,
        'ID del hueco',
        reporte.id_hueco
    );

    crearTexto(
        detalle,
        'ID del ciudadano',
        reporte.id_ciudadano
    );

    tarjeta.appendChild(detalle);

    /* MAPA */

    const lat = Number(reporte.latitud);
    const lng = Number(reporte.longitud);

    if (
        reporte.latitud !== null &&
        reporte.longitud !== null &&
        Number.isFinite(lat) &&
        Number.isFinite(lng) &&
        typeof L !== 'undefined'
    ) {

        const contenedorMapa =
            document.createElement('div');

        contenedorMapa.className =
            'mapa-reporte';

        contenedorMapa.id =
            'mapa-reporte-' + indice;

        tarjeta.appendChild(contenedorMapa);

    }

    /* FOTOGRAFÍA */

    const fotografia =
        document.createElement('div');

    fotografia.className = 'fotografia';

    fotografia.textContent =
        reporte.ruta_imagen
            ? 'Fotografía asociada al reporte. ' +
              'La visualización segura se habilitará próximamente.'
            : 'Este reporte no tiene fotografía asociada.';

    tarjeta.appendChild(fotografia);

    /* BOTONES */

    const acciones =
        document.createElement('div');

    acciones.className = 'acciones';

    const aprobar =
        document.createElement('button');

    aprobar.className = 'aprobar';

    aprobar.type = 'button';

    aprobar.textContent = 'Aprobar reporte';

    const rechazar =
        document.createElement('button');

    rechazar.className = 'rechazar';

    rechazar.type = 'button';

    rechazar.textContent = 'Rechazar reporte';

    aprobar.addEventListener('click', () => {

        validarReporte(
            reporte.id_reporte,
            'APROBADO'
        );

    });

    rechazar.addEventListener('click', () => {

        validarReporte(
            reporte.id_reporte,
            'RECHAZADO'
        );

    });

    acciones.appendChild(aprobar);
    acciones.appendChild(rechazar);

    tarjeta.appendChild(acciones);

    listaReportes.appendChild(tarjeta);

    /* INICIALIZAR MAPA */

    if (
        tarjeta.querySelector('.mapa-reporte') &&
        typeof L !== 'undefined'
    ) {

        const mapa = L.map(
            'mapa-reporte-' + indice
        ).setView([lat, lng], 17);

        L.tileLayer(
            'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
            {
                maxZoom: 19,
                attribution:
                    '&copy; OpenStreetMap contributors'
            }
        ).addTo(mapa);

        L.marker([lat, lng])
            .addTo(mapa);

        mapas.push(mapa);

        requestAnimationFrame(() => {
            mapa.invalidateSize();
        });

    }

}

/* APROBAR O RECHAZAR */

async function validarReporte(idReporte, nuevoEstado) {

    if (!autorizado || cargando) {
        return;
    }

    const accion =
        nuevoEstado === 'APROBADO'
            ? 'aprobar'
            : 'rechazar';

    const confirmado = window.confirm(
        '¿Estás seguro de ' +
        accion +
        ' el reporte #' +
        idReporte +
        '?'
    );

    if (!confirmado) {
        return;
    }

    cargando = true;
    botonActualizar.disabled = true;

    const botones =
        listaReportes.querySelectorAll('button');

    botones.forEach(boton => {
        boton.disabled = true;
    });

    mostrarMensaje(
        'Actualizando estado del reporte...'
    );

    try {

        const { data, error } =
            await supabase.rpc(
                'validar_reporte_hueco',
                {
                    p_id_reporte: idReporte,
                    p_estado: nuevoEstado
                }
            );

        if (error) {
            throw error;
        }

        if (data !== true) {
            throw new Error(
                'No se confirmó la actualización.'
            );
        }

        mostrarMensaje(
            'Reporte #' +
            idReporte +
            ' actualizado a ' +
            nuevoEstado +
            '.',
            'correcto'
        );

    } catch (error) {

        mostrarMensaje(
            'No fue posible actualizar el reporte: ' +
            error.message,
            'error'
        );

        cargando = false;
        botonActualizar.disabled = false;

        botones.forEach(boton => {
            boton.disabled = false;
        });

        return;

    }

    cargando = false;

    await cargarReportes();

}

/* ACTUALIZAR */

botonActualizar.addEventListener(
    'click',
    cargarReportes
);

/* CERRAR SESIÓN */

botonCerrar.addEventListener('click', async () => {

    botonCerrar.disabled = true;

    const { error } =
        await supabase.auth.signOut();

    if (error) {

        mostrarMensaje(
            'No fue posible cerrar sesión: ' +
            error.message,
            'error'
        );

        botonCerrar.disabled = false;

        return;
    }

    window.location.replace(
        'admin-login.html'
    );

});

/* INICIAR */

verificarAcceso();

</script>

</body>
</html>
